# AI-BOS —— 追加到 CloudPanel 站点的 Nginx Vhost（站点 > Vhost 编辑器）
#
# 前提：该站点是 CloudPanel 的「Node.js」类型，App Port 设为 3000（Next.js）。
# CloudPanel 已自动生成把 location / 反代到 127.0.0.1:3000 的配置。
# 你只需在 server {} 里补上：① 上传体积上限；② /api 反代到后端 :8000。

# ① 允许大文件上传（招股书等 PDF 常有 6MB+）
client_max_body_size 50M;

# ② 后端 API 反代（放在 location / 之前）
location /api/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # AI 分析/报告生成可能较久
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;
}
